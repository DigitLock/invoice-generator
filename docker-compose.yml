services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: invoice-generator-api
    restart: unless-stopped
    env_file: ./backend/.env.production
    networks:
      - default
      - expense-tracker-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: invoice-generator-proxy
    ports:
      - "8084:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

networks:
  expense-tracker-net:
    external: true
    name: expense-tracker_backend
